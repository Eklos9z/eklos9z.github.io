name: Pages

on:
  push:
    branches: [main]          # 源码在 main 分支
  workflow_dispatch:

permissions:
  contents: write             # 需要写权限，才能把产物同步到 pages-backup
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"      # 与本地 v22.15.0 一致
          cache: npm
      - name: Install dependencies
        run: npm ci               # 首次报错就换 npm install
      - name: Build
        run: npm run build        # 已含 --max-old-space-size=4096
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public
      - name: Sync build to pages-backup
        # 纯 git 命令实现，不依赖第三方 action（避免 Node 运行时被弃用的连带风险）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd public
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "产物无变化，跳过同步"
          else
            git commit -q -m "Build: ${GITHUB_SHA}"
            git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:pages-backup
            echo "已同步到 pages-backup 分支"
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
